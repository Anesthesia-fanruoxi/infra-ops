# RocketMQ Broker —— Master 节点配置素材
# 说明：{{占位符}} 与部署脚本 broker.sh 变量一致；brokerIP1 须填该主机真实内网 IP，
#       否则客户端/其它 Broker 无法寻址。namesrvAddr 填集群全部 namesrv 的 IP:9876 逗号分隔。

# 集群与节点标识
brokerClusterName={{cluster_name}}
brokerName={{broker_name}}
# 0 表示 Master，非 0（如 1）表示同 brokerName 组的 Slave
brokerId=0

# 命名服务地址（namesrv 列表，分号或逗号分隔；建议填集群内全部 namesrv）
namesrvAddr={{namesrv_addr}}

# 对外广播的真实 IP（=== 务必为宿主机内网 IP，勿用容器 IP ===）
brokerIP1={{__ip}}

# 监听端口与网络
listenPort={{broker_port}}
autoCreateTopicEnable=true

# 存储路径（容器内固定，由 compose 挂宿主目录）
storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog

# 刷盘与消费积压保护
flushDiskType=ASYNC_FLUSH
brokerSlowConsumerEnable=false