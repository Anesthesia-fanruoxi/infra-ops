# RocketMQ Broker —— Slave 节点配置素材
# 与 broker-master.conf 唯一差异：brokerId=1（同为 {{broker_name}} 组，作为 Master 的从库）。
# namesrvAddr 填集群全部 namesrv 的 IP:9876；brokerIP1 务必为宿主机真实内网 IP。

brokerClusterName={{cluster_name}}
brokerName={{broker_name}}
# 同组 Slave：brokerId 取非 0 正整数，与同 brokerName 的 Master(brokerId=0) 组成主备
brokerId={{__broker_id}}

namesrvAddr={{namesrv_addr}}
brokerIP1={{__ip}}

listenPort={{broker_port}}
autoCreateTopicEnable=true

storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog

flushDiskType=ASYNC_FLUSH