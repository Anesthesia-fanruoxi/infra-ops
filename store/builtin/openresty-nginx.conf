user nginx;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # ---- 基础调优 ----
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 20s;
    keepalive_requests 1000;
    server_tokens off;

    # ---- 服务器名哈希（多虚拟主机时避免告警） ----
    server_names_hash_bucket_size 128;
    server_names_hash_max_size 1024;

    # ---- 请求体 / 头部 / 超时 ----
    client_body_timeout 30s;
    client_header_timeout 30s;
    client_max_body_size 100m;
    large_client_header_buffers 4 128k;

    # ---- 日志：JSON 结构化 + 缓冲批量写盘（降低磁盘 IO） ----
    log_format main escape=json
        '{ "@time_local": "$time_iso8601", '
        '"remote_addr": "$remote_addr", '
        '"xff": "$http_x_forwarded_for", '
        '"http_host": "$http_host", '
        '"request_method": "$request_method", '
        '"request_uri": "$request_uri", '
        '"upstream_addr": "$upstream_addr", '
        '"body_bytes_sent": "$body_bytes_sent", '
        '"server_addr": "$server_addr", '
        '"request_time": "$request_time", '
        '"status": "$status", '
        '"http_user_agent": "$http_user_agent" }';
    access_log /var/log/openresty/access.log main buffer=32k flush=2s;
    error_log /var/log/openresty/error.log warn;

    # ---- 压缩 ----
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript text/javascript image/svg+xml;
    gzip_disable "msie6";

    types {
        text/javascript mjs;
    }

    # ---- 后端代理 ----
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;
    proxy_temp_path /var/cache/openresty/proxy_temp;
    proxy_cache_path /var/cache/openresty/proxy_cache levels=1:2:2 keys_zone=pages_cache:256m inactive=60m max_size=10g use_temp_path=off;
    underscores_in_headers on;
    proxy_headers_hash_max_size 51200;
    proxy_headers_hash_bucket_size 6400;

    # ---- FastCGI（保留，兼容 PHP 等场景） ----
    fastcgi_connect_timeout 35s;
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 4 32k;
    fastcgi_busy_buffers_size 64k;
    fastcgi_temp_file_write_size 64k;

    # ---- 限流（在对应 server 内用 limit_req zone=req_limit，默认不触发） ----
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;

    # ---- 站点配置（业务虚拟主机放 /etc/nginx/conf.d/*.conf） ----
    include /etc/nginx/conf.d/*.conf;

    # 默认服务器：未匹配任何虚拟主机时兜底返回 404
    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }
}