// 汇总由明细算出来，保证「筛选前后行数」与「汇总口径」自洽（后端也是 SQL 聚合）
function mockSQLSummary(rows) {
  const ok = rows.filter(r => r.status === 'ok').length
  const sum = k => rows.reduce((a, r) => a + (r[k] || 0), 0)
  return {
    runs: rows.length, ok: ok, failed: rows.length - ok,
    query_runs: rows.filter(r => r.sql_type === 'DQL' || r.sql_type === 'SESSION').length,
    write_runs: rows.filter(r => ['DML', 'DDL', 'OTHER'].indexOf(r.sql_type) >= 0).length,
    rows_returned: sum('row_count'), rows_affected: sum('affected_rows'),
    avg_elapsed_ms: rows.length ? Math.round(sum('elapsed_ms') / rows.length) : 0
  }
}
function mockAISummary(rows) {
  const ok = rows.filter(r => r.status === 'ok').length
  const sum = k => rows.reduce((a, r) => a + (r[k] || 0), 0)
  return {
    calls: rows.length, ok: ok, failed: rows.length - ok,
    prompt_tokens: sum('prompt_tokens'), completion_tokens: sum('completion_tokens'), total_tokens: sum('total_tokens'),
    estimated_calls: rows.filter(r => r.token_source === 'estimated').length,
    avg_elapsed_ms: rows.length ? Math.round(sum('elapsed_ms') / rows.length) : 0
  }
}
function mockLogPage(rows, params, summary) {
  let list = rows.slice()
  if (params.status) list = list.filter(r => r.status === params.status)
  if (params.sql_type) list = list.filter(r => r.sql_type === params.sql_type)
  if (params.kind) list = list.filter(r => r.kind === params.kind)
  return { code: 0, data: { list: list, total: list.length, summary: summary(list), retention_days: RETENTION_DAYS } }
}
window.__gets = [] // 记录 GET 的 url/params，用来核对筛选条件是否真的发到后端
window.api = {
  get(url, opt) {
    const params = (opt && opt.params) || {}
    window.__gets.push({ url: url, params: params })
    if (url === '/mysql/sql-logs') return Promise.resolve(mockLogPage(MOCK_SQL_ROWS, params, mockSQLSummary))
    if (url === '/mysql/ai/logs') return Promise.resolve(mockLogPage(MOCK_AI_ROWS, params, mockAISummary))
    if (url === '/settings/ai') return Promise.resolve({ code: 0, data: { enabled: true, base_url: 'https://api.deepseek.com/v1', model: 'deepseek-chat', has_key: true, timeout: 90 } })
    if (url.endsWith('/ai/catalog/task')) {
      // 后台任务查询：每次轮询推进一步（?genstop 的冻结任务除外），模拟服务端在跑
      mockTaskAdvance()
      return Promise.resolve({ code: 0, data: { task: mockTaskSnap() } })
    }
    if (url.endsWith('/ai/catalog')) {
      const total = (NO_CAT && !catalogBuilt) ? 0 : MOCK_CATALOG.length
      if (params.schema) return Promise.resolve({ code: 0, data: { list: total ? MOCK_CATALOG : [], total: total } })
      return Promise.resolve({ code: 0, data: { list: total ? MOCK_CATALOG : [], total: total, schemas: total ? [{ name: 'demo', total: total }] : [] } })
    }
    if (url.endsWith('/mode')) return Promise.resolve({ code: 0, data: { mode: AI_WRITE ? 'write' : 'read', default_mode: 'read' } })
    if (url.endsWith('/databases')) {
      // ?genfail / ?genstop / ?genbg / ?gen / ?rebuild 多给一个非系统库：
      // 两库才能验「部分完成 + 待跑」的重试 / 停止 / 进度，以及「生成·重建默认只勾当前库」
      const list = NO_DBS ? [] : ((GEN_FAIL || GEN_STOP || GEN_BG || P.has('gen') || P.has('rebuild'))
        ? ['demo', 'shop', 'information_schema', 'mysql', 'performance_schema']
        : ['demo', 'information_schema', 'mysql', 'performance_schema'])
      return Promise.resolve({ code: 0, data: { list: list } })
    }
    if (url.includes('/tables')) {
      const schema = (opt && opt.params && opt.params.schema) || ''
      return Promise.resolve({ code: 0, data: { list: MOCK_TABLES[schema] || [] } })
    }
    if (url.includes('/columns')) {
      return Promise.resolve({ code: 0, data: { columns: MOCK_DETAIL.columns, indexes: MOCK_DETAIL.indexes } })
    }
    if (url.includes('/table')) return Promise.resolve({ code: 0, data: MOCK_DETAIL })
    return Promise.resolve({ code: 0, data: {} })
  },
  post(url, body, cfg) {
    window.__posts.push({ url: url, body: body || null, timeout: (cfg && cfg.timeout) || 0, explicitTimeout: cfg && ('timeout' in cfg) ? cfg.timeout : null })
    // 「取消」接口：让挂起的那条 /query 立刻以「已取消执行」返回（对齐后端 resp.Fail 500）
    if (url.endsWith('/query/cancel')) {
      window.__cancelCalls++
      const p = pendingQuery
      pendingQuery = null
      if (p) p.cancel()
      return delay(30, { code: 0, data: { canceled: !!p } })
    }
    // 执行计划分析：请求体只有 sql + schema（服务端重跑 EXPLAIN 取计划），绝不含结果数据；
    // 必须放在 /query 分支之前——否则会被 url.includes('/query') 先截走
    if (url.endsWith('/query/analyze')) return delay(400, { code: 0, data: MOCK_EXPLAIN_ANALYSIS })
    // /query 挂 300ms 延时：给「点执行→先清旧记录→再出结果」的中间态留出观测窗口；
    // ?cancel 场景第一条挂起 6s（模拟慢 SQL），等「取消」开口立刻中断，之后恢复正常
    if (url.includes('/query')) {
      window.__queryCalls++
      if (P.has('cancel') && window.__queryCalls === 1) {
        return new Promise(resolve => {
          const timer = setTimeout(() => { pendingQuery = null; resolve({ code: 0, data: MOCK_RESULT }) }, 6000)
          pendingQuery = { cancel: () => { clearTimeout(timer); resolve({ code: 500, message: '已取消执行' }) } }
        })
      }
      if (P.has('explain')) return delay(300, { code: 0, data: MOCK_EXPLAIN_RESULT })
      return delay(300, { code: 0, data: MOCK_RESULT })
    }
    if (url.endsWith('/ai/catalog/task/stop')) {
      mockTaskStop()
      return Promise.resolve({ code: 0, data: { task: mockTaskSnap() } })
    }
    if (url.endsWith('/ai/catalog/task')) {
      const picked = (body && body.schemas) || []
      // 已有运行中任务：服务端不再另起（真实后端也这样，避免双倍花 token）
      if (mockTask && mockTask.state === 'running') return Promise.resolve({ code: 0, data: { task: mockTaskSnap(), started: false } })
      if (!picked.length) return Promise.resolve({ code: 0, data: { task: null, started: false } })
      catalogBuilt = true
      mockTaskFailLast = GEN_FAIL && !catRetried
      if (GEN_FAIL) catRetried = true
      const hadTask = !!mockTask
      mockTaskBuild(picked)
      // ?genstop 的首个任务冻结在 running：等前端点「停止」，不自动完成；补齐任务正常推进
      mockTask.frozen = GEN_STOP && !hadTask
      return Promise.resolve({ code: 0, data: { task: mockTaskSnap(), started: true } })
    }
    if (url.endsWith('/ai/catalog')) {
      // 单库同步生成（面板上的「生成 / 重建」仍走同步接口）
      return Promise.resolve({ code: 0, data: { schema: 'demo', total: 3, generated: 0, cached: 3, stale: 0, failed: 0, batches: 0, message: '共 3 张表：新生成 0，命中缓存 3，结构变化 0，失败 0' } })
    }
    if (url.endsWith('/ai/sql')) return Promise.resolve({ code: 0, data: AI_SQL_DATA() })
    return Promise.resolve({ code: 0, data: {} })
  },
  put(url) {
    if (url.endsWith('/mode')) return Promise.resolve({ code: 0, data: { mode: 'write', default_mode: 'read' } })
    if (url === '/settings/ai') return Promise.resolve({ code: 0, data: {} })
    return Promise.resolve({ code: 0, data: {} })
  },
  delete(url) {
    window.__deletes.push(url)
    if (url === '/mysql/sql-logs') { MOCK_SQL_ROWS.length = 0; return Promise.resolve({ code: 0, data: { deleted: 6 } }) }
    if (url === '/mysql/ai/logs') { MOCK_AI_ROWS.length = 0; return Promise.resolve({ code: 0, data: { deleted: 5 } }) }
    return Promise.resolve({ code: 0, data: { deleted: 0 } })
  }
}

// 二次确认 → 后台任务（force=false，请求只带当前库）
async function collectGenRequest() {
  push('—— 生成入口（?gen）——')
  await openAITab()
  const gen = qa('.mysql-ai-catalog .el-button').find(b => b.textContent.trim() === '生成')
  push('「生成」按钮存在: ' + !!gen)
  if (!gen) return
  gen.click()
  await sleep(400)
  const dlg = q('.el-dialog')
  push('弹框打开: ' + !!dlg + ' | 标题: ' + JSON.stringify(txt(dlg && dlg.querySelector('.el-dialog__title'))))
  const rect = dlg.getBoundingClientRect()
  // 纵向留白读计算的 top 而不是 rect.top：headless 虚拟时间下进场动画（-20px）会卡住，rect 会偏小
  const cssTop = parseFloat(getComputedStyle(dlg).top) || 0
  push('弹框尺寸: ' + Math.round(rect.width) + '×' + Math.round(rect.height) + ' = 视口 ' + Math.round(rect.width / window.innerWidth * 100)
    + '% 宽 / ' + Math.round(rect.height / window.innerHeight * 100) + '% 高，上留 ' + Math.round(cssTop / window.innerHeight * 100) + '%')
  push('单库确认视图: ' + !!q('.mysql-ai-gen-cur') + ' 目标库=' + JSON.stringify(txt(q('.mysql-ai-gen-cur-name')))
    + ' | 勾选框数=' + qa('.mysql-ai-gen-db .el-checkbox').length)
  window.__posts.length = 0
  const ok = qa('.el-dialog__footer .el-button').find(b => b.textContent.includes('开始生成'))
  if (ok) ok.click()
  await sleep(300)
  push('二次确认: ' + JSON.stringify(await passConfirm()))
  const p = lastPost('/ai/catalog/task')
  push('生成请求: ' + (p ? p.url + ' body=' + JSON.stringify(p.body) : '(没发出请求)'))
  push('生成请求只带当前库: ' + (p && p.body ? JSON.stringify(p.body.schemas) + ' force=' + p.body.force : '(无)'))
  await sleep(1800)
  push('完成后弹框关闭: ' + !dlgVisible())
  push('生成后提示: ' + JSON.stringify(txt(q('.mysql-ai-catalog-msg'))))
}

// ?nocat：连接没有缓存目录 —— 切到 AI 生成要提示「当前没有缓存语义目录」+ 立即生成，
// 点开弹框自定义勾选库（系统库被过滤），确认后转为后台任务、跑完弹框自动关闭
async function collectNoCatalog() {
  push('—— 无缓存目录（?nocat）——')
  push('无目录提示: ' + JSON.stringify(txt(q('.mysql-ai-nocatalog'))))
  push('目录状态文案: ' + JSON.stringify(txt(q('.mysql-ai-catalog b'))))
  const btn = qa('.mysql-ai-nocatalog .el-button').find(b => b.textContent.includes('立即生成'))
  push('立即生成按钮存在: ' + !!btn)
  if (!btn) return
  btn.click()
  await sleep(400)
  const dlg = q('.el-dialog')
  push('弹框出现: ' + !!dlg + ' | 标题: ' + JSON.stringify(txt(dlg && dlg.querySelector('.el-dialog__title'))))
  const dbs = qa('.mysql-ai-gen-db')
  push('勾选库: ' + (dbs.map(e => txt(e)).join(' | ') || '(无)'))
  push('系统库被过滤: ' + !dbs.some(e => /information_schema|performance_schema/.test(txt(e))))
  push('已选计数: ' + JSON.stringify(txt(q('.mysql-ai-gen-count'))))
  // 取消勾选全部 → 确认按钮置灰；再全选回来 → 点开始生成（转为服务端后台任务）
  const cb = dbs[0] && dbs[0].querySelector('.el-checkbox')
  if (cb) { cb.click(); await sleep(300) }
  const off = qa('.el-dialog__footer .el-button').find(b => b.textContent.includes('开始生成'))
  push('清空后确认置灰: ' + (off ? off.classList.contains('is-disabled') : 'n/a'))
  if (cb) { cb.click(); await sleep(300) }
  window.__posts.length = 0
  const ok = qa('.el-dialog__footer .el-button').find(b => b.textContent.includes('开始生成'))
  if (ok) ok.click()
  await sleep(300)
  push('批量生成二次确认: ' + JSON.stringify(await passConfirm()))
  const p = lastPost('/ai/catalog/task')
  push('批量生成请求: ' + (p ? p.url + ' body=' + JSON.stringify(p.body) + ' timeout=' + p.timeout : '(没发出请求)'))
  push('启动后弹框保留(进度视图): ' + dlgVisible() + ' 进度=' + !!q('.mysql-ai-gen-progress'))
  await sleep(1600)
  push('生成后弹框关闭: ' + !dlgVisible())
  push('生成后提示: ' + JSON.stringify(txt(q('.mysql-ai-catalog-msg'))))
  push('生成后目录状态: ' + JSON.stringify(txt(q('.mysql-ai-catalog b'))))
}

// ?genfail：后台任务有库失败 —— 任务跑完弹框自动切「失败重试」视图（只勾失败库），
// 再点一次只把失败库提交成新任务（失败批次的表没落库，重试只补失败部分）
async function collectGenRetry() {
  push('—— 批量生成失败重试（?genfail）——')
  const footer = () => qa('.el-dialog__footer .el-button')
  const open = qa('.mysql-ai-catalog .el-button').find(b => b.textContent.trim() === '批量生成')
  push('批量生成按钮存在: ' + !!open)
  if (!open) return
  open.click()
  await sleep(400)
  push('弹框打开: ' + dlgVisible())
  push('默认勾选库: ' + (qa('.mysql-ai-gen-db').map(e => txt(e)).join(' | ') || '(无)'))
  window.__posts.length = 0
  const ok1 = footer().find(b => b.textContent.includes('开始生成'))
  push('首次按钮: ' + (ok1 ? JSON.stringify(txt(ok1)) : '(无)'))
  if (ok1) ok1.click()
  await sleep(300)
  push('首次二次确认: ' + JSON.stringify(await passConfirm()))
  const p1 = lastPost('/ai/catalog/task')
  push('启动请求: ' + (p1 ? p1.url + ' body=' + JSON.stringify(p1.body) : '(没发出请求)'))
  push('运行中布局: footer=[' + footer().map(txt).join(' / ') + '] 进度视图=' + !!q('.mysql-ai-gen-progress')
    + ' | 面板进度行=' + !!q('.mysql-ai-task'))
  await sleep(1600)
  push('一拍后进度: ' + JSON.stringify(txt(q('.mysql-ai-gen-progress-top')))
    + ' | 每库: ' + qa('.mysql-ai-gen-state').map(txt).join(' / '))
  push('一拍后生成记录: ' + qa('.mysql-ai-gen-record').length + ' 条 | 失败条=' + qa('.mysql-ai-gen-record.is-bad').length)
  await sleep(1600)
  // 第二拍：shop 完成但带 2 条失败 → 任务 done，轮询收尾切「失败重试」视图
  push('失败后弹框保留: ' + dlgVisible())
  push('失败提示条: ' + JSON.stringify(cut(txt(q('.mysql-ai-gen-failed')), 80)))
  push('失败后自动勾选: ' + (qa('.mysql-ai-gen-db .el-checkbox.is-checked').map(txt).join(',') || '(无)'))
  push('失败后生成记录: ' + qa('.mysql-ai-gen-record').length + ' 条 | 记录头: ' + JSON.stringify(txt(q('.mysql-ai-gen-records-head')))
    + ' | 失败记录: ' + qa('.mysql-ai-gen-record.is-bad').length + ' 条 | 首行: ' + JSON.stringify(txt(qa('.mysql-ai-gen-record')[0])))
  push('失败记录行: ' + JSON.stringify(qa('.mysql-ai-gen-record.is-bad').map(txt).join(' / ')))
  push('已选计数: ' + JSON.stringify(txt(q('.mysql-ai-gen-count'))))
  const retry = footer().find(b => b.textContent.includes('重试'))
  push('重试按钮: ' + (retry ? JSON.stringify(txt(retry)) : '(无)'))
  push('失败后面板提示行: ' + JSON.stringify(cut(txt(q('.mysql-ai-task')), 80)))
  window.__posts.length = 0
  if (retry) retry.click()
  await sleep(300)
  push('重试二次确认: ' + JSON.stringify(await passConfirm()))
  const p2 = lastPost('/ai/catalog/task')
  push('重试请求体: ' + (p2 ? p2.url + ' ' + JSON.stringify(p2.body) : '(没发出请求)'))
  await sleep(1600)
  push('重试后弹框关闭: ' + !dlgVisible())
  push('重试后提示: ' + JSON.stringify(txt(q('.mysql-ai-catalog-msg'))))
}

// ?genstop：任务运行中点「停止生成」—— 服务端取消当前库，快照转 stopped，
// 弹框留存给停止提示与补齐勾选，再点「开始生成」即提交新任务补齐
async function collectGenStop() {
  push('—— 生成中途停止（?genstop）——')
  const footer = () => qa('.el-dialog__footer .el-button')
  const open = qa('.mysql-ai-catalog .el-button').find(b => b.textContent.trim() === '批量生成')
  push('批量生成按钮存在: ' + !!open)
  if (!open) return
  open.click()
  await sleep(400)
  push('弹框打开: ' + dlgVisible())
  const before = footer().find(b => b.textContent.trim() === '取消')
  push('运行前左按钮: ' + (before ? JSON.stringify(txt(before)) : '(无)'))
  window.__posts.length = 0
  const start = footer().find(b => b.textContent.includes('开始生成'))
  if (start) start.click()
  await sleep(300)
  push('启动二次确认: ' + JSON.stringify(await passConfirm()))
  const p1 = lastPost('/ai/catalog/task')
  push('启动请求: ' + (p1 ? p1.url + ' body=' + JSON.stringify(p1.body) : '(没发出请求)'))
  push('运行中布局: footer=[' + footer().map(txt).join(' / ') + '] 进度视图=' + !!q('.mysql-ai-gen-progress')
    + ' 当前库行: ' + qa('.mysql-ai-gen-state').map(txt).join(' / ') + ' 生成记录块=' + !!q('.mysql-ai-gen-records'))
  push('面板进度行: ' + JSON.stringify(cut(txt(q('.mysql-ai-task')), 60)))
  push('停止前弹框保留: ' + dlgVisible())
  const stop = footer().find(b => b.textContent.includes('停止'))
  if (stop) stop.click()
  await sleep(500)
  push('停止请求: ' + JSON.stringify(window.__posts.filter(p => p.url.includes('/task/stop')).map(p => p.url)))
  push('停止后 footer: ' + JSON.stringify(footer().map(txt).join(' / ')))
  push('停止后弹框保留: ' + dlgVisible())
  push('停止提示条: ' + JSON.stringify(cut(txt(q('.mysql-ai-gen-stopped')), 80)))
  push('停止后自动勾选: ' + (qa('.mysql-ai-gen-db .el-checkbox.is-checked').map(txt).join(',') || '(无)'))
  push('停止后生成记录: ' + qa('.mysql-ai-gen-record').length + ' 条（冻结任务没推进，应为 0）')
  push('停止 toast: ' + JSON.stringify(qa('.el-message').map(txt).join(' | ')))
  push('停止后面板提示行: ' + JSON.stringify(cut(txt(q('.mysql-ai-task')), 70)))
  // 再点一次「开始生成」补齐：这次任务正常推进到全完成，弹框自动关闭
  window.__posts.length = 0
  const again = footer().find(b => b.textContent.includes('开始生成'))
  push('可再次开始: ' + (again ? JSON.stringify(txt(again)) : '(无)'))
  if (again) again.click()
  await sleep(300)
  push('补齐二次确认: ' + JSON.stringify(await passConfirm()))
  const p2 = lastPost('/ai/catalog/task')
  push('补齐请求体: ' + (p2 ? p2.url + ' ' + JSON.stringify(p2.body) : '(没发出请求)'))
  await sleep(1400)
  push('补齐一拍进度: ' + JSON.stringify(txt(q('.mysql-ai-gen-progress-top'))))
  push('补齐一拍生成记录: ' + qa('.mysql-ai-gen-record').length + ' 条')
  await sleep(1900)
  push('补齐后弹框关闭: ' + !dlgVisible())
  push('补齐后提示: ' + JSON.stringify(txt(q('.mysql-ai-catalog-msg'))))
}

// ?genbg：后台运行 —— 任务在服务端跑，关弹框不受影响：面板进度行实时更新，
// 随时重开弹框看每库进度；全部完成后进度行消失、提示汇总
async function collectGenBackground() {
  push('—— 后台运行（?genbg）——')
  const footer = () => qa('.el-dialog__footer .el-button')
  const open = qa('.mysql-ai-catalog .el-button').find(b => b.textContent.trim() === '批量生成')
  push('批量生成按钮存在: ' + !!open)
  if (!open) return
  open.click()
  await sleep(400)
  push('默认勾选库: ' + (qa('.mysql-ai-gen-db').map(e => txt(e)).join(' | ') || '(无)'))
  const start = footer().find(b => b.textContent.includes('开始生成'))
  if (start) start.click()
  await sleep(300)
  push('启动二次确认: ' + JSON.stringify(await passConfirm()))
  push('启动后进度视图: ' + !!q('.mysql-ai-gen-progress') + ' footer=[' + footer().map(txt).join(' / ') + ']')
  const bg = footer().find(b => b.textContent.includes('后台运行'))
  if (bg) bg.click()
  await sleep(500)
  push('关弹框后: 弹框关闭=' + !dlgVisible() + ' 面板进度行=' + !!q('.mysql-ai-task'))
  await sleep(1200)
  // 第一拍（t0+1500）后：面板行推进到「1/2 · 当前 shop」，任务不因弹框关闭而中断
  push('后台一拍后面板行: ' + JSON.stringify(cut(txt(q('.mysql-ai-task')), 70)))
  const view = qa('.mysql-ai-task .el-button').find(b => b.textContent.includes('查看进度'))
  push('查看进度按钮: ' + (view ? JSON.stringify(txt(view)) : '(无)'))
  if (view) view.click()
  await sleep(400)
  push('重开弹框: ' + dlgVisible() + ' 进度=' + JSON.stringify(txt(q('.mysql-ai-gen-progress-top')))
    + ' | 每库: ' + qa('.mysql-ai-gen-state').map(txt).join(' / ')
    + ' | 生成记录: ' + qa('.mysql-ai-gen-record').length + ' 条')
  const bg2 = footer().find(b => b.textContent.includes('后台运行'))
  if (bg2) bg2.click()
  await sleep(1600)
  // 第二拍（t0+3000）任务完成、轮询收尾：不在打开态就不重开弹框，面板进度行消失
  push('完成后弹框仍关: ' + !dlgVisible())
  push('完成后面板进度行: ' + (q('.mysql-ai-task') ? JSON.stringify(cut(txt(q('.mysql-ai-task')), 60)) : '(已消失)'))
  push('完成后提示: ' + JSON.stringify(txt(q('.mysql-ai-catalog-msg'))))
  push('完成后目录状态: ' + JSON.stringify(txt(q('.mysql-ai-catalog b'))))
}

;(async () => {
  await sleep(600)
  if (LOGS_ONLY) {
    await collectLogs()
    if (LOGS_TAB === 'ai' || P.has('aitab')) await collectLogsAI()
    if (P.has('clear')) await collectLogsClear()
    push('JS 错误: ' + (errors.length ? errors.join(' | ') : '无'))
    q('#out').textContent = out.join('\n')
    return
  }
  if (NO_CAT) {
    // 复现「打开工作台直接切到 AI 生成、连接还没任何缓存目录」的路径
    await openAITab()
    await sleep(500)
    await collectNoCatalog()
  } else if (GEN_FAIL) {
    // 批量生成部分失败 → 弹框留存、自动勾失败库、重试只发失败库（默认有缓存场景，走「批量生成」按钮）
    await openAITab()
    await sleep(500)
    await collectGenRetry()
  } else if (GEN_STOP) {
    // 运行中停止 → 任务停住、弹框留存给停止提示与勾选，可再次开始补齐
    await openAITab()
    await sleep(500)
    await collectGenStop()
  } else if (GEN_BG) {
    // 后台运行 → 关弹框任务继续跑，面板进度行实时更新，重开弹框恢复进度视图
    await openAITab()
    await sleep(500)
    await collectGenBackground()
  } else if (NO_DEF) {
    // 不点任何库/表：完全复现用户「打开工作台直接切到 AI 生成」的路径
    await openAITab()
    await sleep(500)
    if (NO_DBS) await collectNoDbs()
    else await collectAutoPick()
  } else {
    const demo = qa('.mysql-db-row').find(r => r.textContent.includes('demo'))
    if (demo) demo.click()
    await sleep(500)
    const users = qa('.mysql-tb-row').find(r => r.textContent.includes('users'))
    if (users) users.click()
    await sleep(700)

    await collectBase()
    if (P.has('idx')) await collectIndexes()
    if (P.has('ddl')) await collectDDL()
    if (P.has('showsys')) await collectShowSys()
    if (P.has('query')) await collectQueryData()
    if (P.has('cancel')) await collectCancel()
    if (P.has('explain')) await collectExplain()
    if (P.has('ai')) await collectAI()
    if (AI_WRITE) await collectAIWrite()
    if (P.has('aiswitch')) await collectAIModeSwitch()
    if (P.has('gen')) await collectGenRequest()
    if (P.has('rebuild')) await collectGenRebuild()
    if (P.has('switch')) await collectSwitch()
  }

  push('JS 错误: ' + (errors.length ? errors.join(' | ') : '无'))
  q('#out').textContent = out.join('\n')
})()
  </script>
